spring.application.name=genoclasifica

# Entornos (sección 2.5): dev por defecto; qa y staging se activan con --spring.profiles.active
spring.profiles.default=dev
spring.jpa.open-in-view=true

# La clave de los usuarios y el secreto del JWT no se guardan en el repo: se leen de variables de entorno
genoclasifica.usuarios.clave=${GENOCLASIFICA_CLAVE_USUARIOS}
genoclasifica.jwt.secreto=${GENOCLASIFICA_JWT_SECRETO}
