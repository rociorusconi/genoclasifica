# Desarrollo: base en memoria, se borra al apagar. Pruebas unitarias, TDD y la suite de Maven.
spring.datasource.url=jdbc:h2:mem:genoclasifica-dev
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Valores sintéticos solo para desarrollo local; si existe la variable de entorno, se usa esa
genoclasifica.usuarios.clave=${GENOCLASIFICA_CLAVE_USUARIOS:Clave-Sintetica-123}
genoclasifica.jwt.secreto=${GENOCLASIFICA_JWT_SECRETO:secreto-local-de-desarrollo-genoclasifica-hs256}
