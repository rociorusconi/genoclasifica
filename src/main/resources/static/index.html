<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GenoClasifica</title>
    <link rel="stylesheet" href="portal.css">
</head>
<body>
<header>
    <h1>GenoClasifica</h1>
    <div id="sesion" hidden>
        <span id="usuario-actual"></span> · <span id="rol-actual"></span>
        <button id="btn-salir" type="button">Salir</button>
    </div>
</header>

<main>
    <p id="mensaje" role="status" hidden></p>

    <section id="pantalla-login">
        <h2>Iniciar sesión</h2>
        <form id="form-login">
            <label>Usuario <input id="usuario" autocomplete="username" required></label>
            <label>Clave <input id="clave" type="password" autocomplete="current-password" required></label>
            <button id="btn-ingresar" type="submit">Ingresar</button>
        </form>
        <p class="nota">Datos sintéticos. Usuarios: tecnico_lab, bio_user, genetista_1, admin, auditor.</p>
    </section>

    <section id="pantalla-principal" hidden>
        <section id="registro" data-roles="TECNICO ADMINISTRADOR" hidden>
            <h2>Registrar corrida</h2>
            <form id="form-registro">
                <label>Código de muestra <input id="reg-codigo" required></label>
                <label>ID de corrida <input id="reg-corrida" required></label>
                <label>Contenido del archivo <input id="reg-contenido" required></label>
                <label>Q30 (%) <input id="reg-q30" type="number" step="0.1" required></label>
                <label>Contaminación (%) <input id="reg-contaminacion" type="number" step="0.1" required></label>
                <label>Gen <input id="reg-gen" value="BRCA1" required></label>
                <label>Posición <input id="reg-posicion" type="number" value="43071077" required></label>
                <label>Categoría propuesta
                    <select id="reg-categoria">
                        <option>BENIGNA</option>
                        <option>PROBABLEMENTE_BENIGNA</option>
                        <option>SIGNIFICADO_INCIERTO</option>
                        <option>PROBABLEMENTE_PATOGENICA</option>
                        <option>PATOGENICA</option>
                    </select>
                </label>
                <label>Confianza (%) <input id="reg-confianza" type="number" step="0.1" value="90" required></label>
                <button id="btn-registrar" type="submit">Registrar</button>
            </form>
        </section>

        <section>
            <h2>Muestras</h2>
            <form id="form-buscar">
                <label>Buscar por código <input id="buscar-codigo" required></label>
                <button id="btn-buscar" type="submit">Buscar</button>
                <button id="btn-actualizar" type="button">Actualizar lista</button>
            </form>
            <table id="tabla-muestras">
                <thead><tr><th>Código</th><th>Corrida</th><th>Estado</th><th>Recepción</th><th></th></tr></thead>
                <tbody></tbody>
            </table>
        </section>

        <section id="detalle" hidden>
            <h2>Muestra <span id="det-codigo"></span></h2>
            <p>Estado: <strong id="det-estado"></strong></p>
            <p>Q30: <span id="det-q30"></span> % · Contaminación: <span id="det-contaminacion"></span> %
                · Firmada por: <span id="det-firma"></span></p>
            <table id="tabla-variantes">
                <thead><tr><th>Gen</th><th>Posición</th><th>Propuesta</th><th>Confianza</th><th>Categoría</th><th>Revisión</th><th>Exige firma</th></tr></thead>
                <tbody></tbody>
            </table>
            <div class="acciones">
                <button id="btn-procesar" type="button" data-roles="BIOINFORMATICO ADMINISTRADOR" hidden>Procesar</button>
                <button id="btn-firmar" type="button" data-roles="GENETISTA" hidden>Firmar diagnóstico</button>
                <button id="btn-informe" type="button" data-roles="TECNICO GENETISTA ADMINISTRADOR" hidden>Descargar informe PDF</button>
            </div>
        </section>
    </section>
</main>
<script src="portal.js"></script>
</body>
</html>
